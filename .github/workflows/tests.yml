# Tests on every push and pull request.
#
# Separate from `gaffer.yml` on purpose. That workflow fetches the FPL API,
# solves, and commits the rewritten page — none of which should happen on a
# pull request. Its test step still guards the deadline-morning run, but it
# only fires on a schedule, so without this file nothing checks a branch
# before it is merged. A planner rule broken in a PR would then surface for
# the first time on deadline morning, which is the exact failure the tests
# exist to prevent.
name: tests
on:
  push:
    branches: ["**"]
  pull_request:
  # A run that never started still has to be restartable. A commit pushed by
  # the `gaffer` workflow's own token arrives as the bot, and GitHub holds such
  # a run for manual approval; leave it unapproved and it is closed out as a
  # failure having executed nothing — a red PR with zero jobs and no way back
  # except another commit. This is that way back.
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
