name: gaffer
on:
  schedule:
    # Wakes daily and re-reads the real deadline from the API, because FPL can
    # move a deadline (never within 24h of it). On a non-deadline day the job
    # exits in a few seconds and commits nothing.
    - cron: "0 6 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      free_transfers:
        description: "Free transfers available this week (1-5)"
        required: false
        default: "1"
      force:
        description: "Solve even when no deadline falls today"
        required: false
        type: boolean
        default: false
      wildcard:
        description: "Draft a wildcard for this gameweek (blank = use chip_plan)"
        required: false
        default: ""
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: tests
        run: python -m pytest tests -q
      - name: train models if missing
        run: |
          if [ ! -f models/minutes.joblib ]; then
            echo "no trained models in the repo — training now (a few minutes)"
            python -m gaffer.learn
          fi
      - name: solve
        env:
          FORCE: ${{ github.event.inputs.force }}
          FT: ${{ github.event.inputs.free_transfers }}
          WC: ${{ github.event.inputs.wildcard }}
        run: |
          # The gate exists so the daily cron costs seconds on an ordinary day.
          # Dispatching with force on is how you ask for a solve anyway — the
          # wildcard is drafted weeks before its deadline, so it cannot wait
          # for one.
          # `a && b` as a statement is a trap under `bash -e`: on a scheduled
          # run FORCE is empty, the test fails, and the step dies before the
          # solve. An `if` returns zero either way.
          gate=--only-on-deadline-day
          if [ "$FORCE" = "true" ]; then gate=""; fi
          wc=""
          if [ -n "$WC" ]; then wc="--wildcard $WC"; fi
          python -m gaffer.main $gate $wc --free-transfers "$FT"
      - name: publish
        run: |
          git config user.name gaffer
          git config user.email gaffer@users.noreply.github.com
          git add docs models
          git diff --staged --quiet || git commit -m "gaffer: $(date -u +%F)"
          git push
