<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gaffer</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="app.css">
<!-- Inline so the page stays a three-file deploy and the browser stops
     probing for a favicon that is not there. The README tells you to add
     this to your home screen, so it needs an icon. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Ctext x='16' y='23' font-size='20' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gaffer">
</head>
<body>
<header class="top">
  <div class="wrap" style="padding:0">
    <div class="brand">Gaffer</div>
    <div class="sub" id="sub">Loading…</div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" id="tab-team"    aria-selected="true"  aria-controls="view-team">Team</button>
      <button class="tab" role="tab" id="tab-players" aria-selected="false" aria-controls="view-players">Players</button>
      <button class="tab" role="tab" id="tab-compare" aria-selected="false" aria-controls="view-compare">Compare</button>
      <button class="tab" role="tab" id="tab-plan"    aria-selected="false" aria-controls="view-plan">Plan</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <p id="loading" class="muted">Fetching the latest solve…</p>
  <p id="failed" class="err hidden"></p>

  <section id="view-team"    role="tabpanel" aria-labelledby="tab-team"></section>
  <section id="view-players" role="tabpanel" aria-labelledby="tab-players" class="hidden"></section>
  <section id="view-compare" role="tabpanel" aria-labelledby="tab-compare" class="hidden"></section>
  <section id="view-plan"    role="tabpanel" aria-labelledby="tab-plan"    class="hidden"></section>

  <p class="note">
    Projections blend Solio Analytics' public feed with a local model.
    Recommendations, not instructions — you press the button.
    <a href="report.html">Plain report</a> works without JavaScript.
  </p>
</main>

<script src="app.js"></script>
</body>
</html>
